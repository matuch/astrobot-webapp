<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Натальная карта — анкета</title>
<script src="telegram-web-app.js"></script> <!-- локальная копия: telegram.org может не открыться в вебвью -->
<style>
  :root {
    --bg0: #0a0a1e;
    --bg1: #161638;
    --gold: #d4af37;
    --gold-dim: rgba(212, 175, 55, .35);
    --text: #ece9f7;
    --muted: #9a94b8;
    --card: rgba(255, 255, 255, .045);
    --error: #ff7a90;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1px 1px at 12% 22%, #fff8 50%, transparent 51%),
      radial-gradient(1px 1px at 78% 12%, #fff6 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 55% 38%, #fff9 50%, transparent 51%),
      radial-gradient(1px 1px at 88% 55%, #fff5 50%, transparent 51%),
      radial-gradient(1px 1px at 30% 68%, #fff7 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 66% 82%, #fff8 50%, transparent 51%),
      radial-gradient(1px 1px at 8% 88%, #fff5 50%, transparent 51%),
      radial-gradient(ellipse 90% 60% at 50% -10%, #2c2160 0%, transparent 60%),
      linear-gradient(165deg, var(--bg1) 0%, var(--bg0) 70%);
    display: flex;
    justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  .card {
    width: 100%;
    max-width: 420px;
    align-self: center;
    background: var(--card);
    border: 1px solid rgba(212, 175, 55, .18);
    border-radius: 24px;
    padding: 28px 22px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .06);
  }
  .glyph { text-align: center; font-size: 34px; color: var(--gold); text-shadow: 0 0 22px var(--gold-dim); }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 500;
    font-size: 22px;
    text-align: center;
    letter-spacing: .04em;
    margin: 10px 0 4px;
  }
  .subtitle { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 22px; }

  .dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 24px; }
  .dot {
    width: 26px; height: 4px; border-radius: 2px;
    background: rgba(255, 255, 255, .12);
    transition: background .3s;
  }
  .dot.active { background: var(--gold); box-shadow: 0 0 10px var(--gold-dim); }

  .step { display: none; animation: fade .25s ease; }
  .step.visible { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  label.field-label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 8px; }
  label.field-label .planet { color: var(--gold); margin-right: 6px; }

  input[type="text"], select {
    width: 100%;
    min-width: 0;
    display: block;
    padding: 14px 16px;
    font-size: 17px; /* no iOS zoom on focus */
    color: var(--text);
    background: rgba(0, 0, 0, .28);
    border: 1px solid rgba(255, 255, 255, .12);
    border-radius: 14px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
    color-scheme: dark;
  }
  input:focus, select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212, 175, 55, .15); }
  input:disabled, select:disabled { opacity: .35; }
  input::placeholder { color: var(--muted); }

  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 15px; }
  .hint.error { color: var(--error); }

  .checkbox-row {
    display: flex; align-items: center; gap: 10px;
    margin-top: 14px; font-size: 14px; color: var(--muted);
    cursor: pointer; user-select: none;
  }
  .checkbox-row input { width: 18px; height: 18px; accent-color: var(--gold); }

  .picker-row { display: flex; gap: 8px; align-items: center; }
  .picker-row select { flex: 1; min-width: 0; }
  .picker-sep { color: var(--gold); font-size: 22px; }

  .suggestions {
    margin-top: 6px;
    border: 1px solid rgba(255, 255, 255, .1);
    border-radius: 14px;
    overflow: hidden;
    background: rgba(10, 10, 30, .92);
    display: none;
  }
  .suggestions.open { display: block; }
  .suggestion {
    padding: 12px 16px; font-size: 15px; cursor: pointer;
    border-bottom: 1px solid rgba(255, 255, 255, .05);
  }
  .suggestion:last-child { border-bottom: none; }
  .suggestion:active, .suggestion:hover { background: rgba(212, 175, 55, .12); }
  .suggestion small { display: block; color: var(--muted); font-size: 12px; }

  .nav { display: flex; gap: 10px; margin-top: 26px; }
  button {
    flex: 1;
    padding: 15px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: transform .1s, box-shadow .2s;
  }
  button:active { transform: scale(.97); }
  .btn-primary {
    color: #14102a;
    background: linear-gradient(135deg, #e8c766, var(--gold) 55%, #a8842a);
    box-shadow: 0 6px 22px rgba(212, 175, 55, .28);
  }
  .btn-ghost { flex: 0 0 92px; color: var(--muted); background: rgba(255, 255, 255, .07); }

  .done { text-align: center; padding: 30px 0 10px; }
  .done .glyph { font-size: 46px; }
  .done p { color: var(--muted); margin-top: 12px; font-size: 14px; line-height: 1.5; }
  pre.debug {
    margin-top: 14px; padding: 12px; font-size: 11px; text-align: left;
    background: rgba(0,0,0,.4); border-radius: 10px; overflow-x: auto; color: var(--muted);
  }
</style>
</head>
<body>
<div class="card">
  <div class="glyph">☉</div>
  <h1>Натальная карта</h1>
  <p class="subtitle">Четыре шага — и звёзды расскажут о вас</p>

  <div class="dots" id="dots">
    <div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>

  <form id="wizard" novalidate>
    <!-- Шаг 1: имя -->
    <section class="step visible" data-step="0">
      <label class="field-label" for="name"><span class="planet">♀</span>Ваше имя</label>
      <input type="text" id="name" autocomplete="name" placeholder="Например, Анна" maxlength="60">
      <p class="hint" id="hint-name"></p>
    </section>

    <!-- Шаг 2: дата рождения -->
    <section class="step" data-step="1">
      <label class="field-label"><span class="planet">☽</span>Дата рождения</label>
      <!-- ponytail: нативный datepicker в вебвью Telegram Desktop бажит — поэтому селекты -->
      <div class="picker-row">
        <select id="birth-day" aria-label="День"></select>
        <select id="birth-month" aria-label="Месяц"></select>
        <select id="birth-year" aria-label="Год"></select>
      </div>
      <p class="hint" id="hint-date"></p>
    </section>

    <!-- Шаг 3: время рождения -->
    <section class="step" data-step="2">
      <label class="field-label"><span class="planet">☿</span>Время рождения</label>
      <div class="picker-row">
        <select id="birth-hour" aria-label="Час"></select>
        <span class="picker-sep">:</span>
        <select id="birth-minute" aria-label="Минута"></select>
      </div>
      <label class="checkbox-row">
        <input type="checkbox" id="time-unknown">
        Не знаю точное время
      </label>
      <p class="hint" id="hint-time">Если время неизвестно, карта строится на 12:00 — позиции домов будут приблизительными.</p>
    </section>

    <!-- Шаг 4: город -->
    <section class="step" data-step="3">
      <label class="field-label" for="city"><span class="planet">♁</span>Город рождения</label>
      <input type="text" id="city" autocomplete="off" placeholder="Начните вводить город…" maxlength="100">
      <div class="suggestions" id="suggestions"></div>
      <p class="hint" id="hint-city"></p>
    </section>

    <div class="nav">
      <button type="button" class="btn-ghost" id="back" hidden>Назад</button>
      <button type="button" class="btn-primary" id="next">Далее</button>
    </div>
  </form>

  <div class="done" id="done" hidden>
    <div class="glyph">✦</div>
    <p id="done-text">Анкета отправлена.<br>Возвращайтесь в чат — карта уже строится.</p>
    <pre class="debug" id="debug" hidden></pre>
  </div>
  <p style="text-align:center;font-size:11px;color:#9a94b8;margin-top:14px;">v5</p>
</div>

<script>
"use strict";

/* ---------- Определение платформы ---------- */
// ponytail: на iOS reply-keyboard webapp получает в hash только tgWebAppPlatform,
// tgWebAppData там может не быть — поэтому детектим по любому признаку
const isTelegram = location.hash.includes("tgWebAppData=")
  || location.hash.includes("tgWebAppPlatform=")
  || !!(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData);
const tg = window.Telegram && window.Telegram.WebApp;
let maxApp = null;
// URL приёмника для MAX (у Bridge нет аналога tg.sendData). Заполняется при деплое.
const MAX_ENDPOINT = "";

if (isTelegram && tg) {
  tg.ready();
  tg.expand();
} else if (!isTelegram) {
  // MAX Bridge создаёт window.WebApp сам; в браузере его нет.
  const s = document.createElement("script");
  s.src = "https://st.max.ru/js/max-web-app.js";
  s.onload = () => { if (window.WebApp && window.WebApp.initData) maxApp = window.WebApp; };
  document.head.appendChild(s);
}

/* ---------- Элементы ---------- */
const steps = [...document.querySelectorAll(".step")];
const dots = [...document.querySelectorAll("#dots .dot")];
const backBtn = document.getElementById("back");
const nextBtn = document.getElementById("next");
const nameEl = document.getElementById("name");
const dayEl = document.getElementById("birth-day");
const monthEl = document.getElementById("birth-month");
const yearEl = document.getElementById("birth-year");
const hourEl = document.getElementById("birth-hour");
const minuteEl = document.getElementById("birth-minute");
const timeUnknownEl = document.getElementById("time-unknown");
const cityEl = document.getElementById("city");
const suggEl = document.getElementById("suggestions");

/* ---------- Наполнение селектов ---------- */
const MONTHS_RU = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];

function fillSelect(el, values, placeholder) {
  el.innerHTML = "";
  const ph = document.createElement("option");
  ph.value = "";
  ph.textContent = placeholder;
  ph.disabled = true;
  ph.selected = true;
  el.appendChild(ph);
  for (const [v, label] of values) {
    const o = document.createElement("option");
    o.value = v;
    o.textContent = label;
    el.appendChild(o);
  }
}

const nowYear = new Date().getFullYear();
fillSelect(dayEl, Array.from({length: 31}, (_, i) => [String(i + 1), String(i + 1)]), "День");
fillSelect(monthEl, MONTHS_RU.map((m, i) => [String(i + 1).padStart(2, "0"), m]), "Месяц");
fillSelect(yearEl, Array.from({length: nowYear - 1900 + 1}, (_, i) => [String(nowYear - i), String(nowYear - i)]), "Год");
fillSelect(hourEl, Array.from({length: 24}, (_, i) => [String(i).padStart(2, "0"), String(i).padStart(2, "0")]), "—");
fillSelect(minuteEl, Array.from({length: 60}, (_, i) => [String(i).padStart(2, "0"), String(i).padStart(2, "0")]), "—");
hourEl.value = "12";
minuteEl.value = "00";

function daysInMonth(year, month) {
  return new Date(year, month, 0).getDate(); // month: 1-12
}

function clampDay() {
  const prev = dayEl.value;
  const y = Number(yearEl.value) || 2000;
  const m = Number(monthEl.value) || 1;
  const max = daysInMonth(y, m);
  while (dayEl.options.length - 1 > max) dayEl.remove(dayEl.options.length - 1);
  while (dayEl.options.length - 1 < max) {
    const d = dayEl.options.length; // учитывая placeholder
    const o = document.createElement("option");
    o.value = String(d);
    o.textContent = String(d);
    dayEl.appendChild(o);
  }
  if (!prev) return;
  dayEl.value = Number(prev) <= max ? prev : String(max); // 29 февраля -> 28 в невисокосном
}
monthEl.addEventListener("change", clampDay);
yearEl.addEventListener("change", clampDay);

let current = 0;

/* ---------- Навигация по шагам ---------- */
function showStep(n) {
  current = n;
  steps.forEach((s, i) => s.classList.toggle("visible", i === n));
  dots.forEach((d, i) => d.classList.toggle("active", i <= n));
  backBtn.hidden = n === 0;
  nextBtn.textContent = n === steps.length - 1 ? "✨ Построить натальную карту" : "Далее";
}

function setHint(id, msg, isError) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.toggle("error", !!isError);
  if (!isError && !msg) el.textContent = "";
}

function validateStep(n) {
  if (n === 0) {
    const v = nameEl.value.trim();
    if (!/^[А-Яа-яЁёA-Za-z\-' ]{2,}$/.test(v)) {
      setHint("hint-name", "Введите имя (минимум 2 буквы).", true);
      return false;
    }
    setHint("hint-name", "");
    return true;
  }
  if (n === 1) {
    const ok = dayEl.value && monthEl.value && yearEl.value;
    setHint("hint-date", ok ? "" : "Выберите день, месяц и год.", !ok);
    return !!ok;
  }
  if (n === 2) {
    const ok = timeUnknownEl.checked || (hourEl.value !== "" && minuteEl.value !== "");
    setHint("hint-time", ok ? "" : "Укажите время или отметьте «Не знаю точное время».", !ok);
    return ok;
  }
  if (n === 3) {
    const ok = cityEl.value.trim().length >= 2;
    setHint("hint-city", ok ? "" : "Введите город рождения.", !ok);
    return ok;
  }
  return true;
}

backBtn.addEventListener("click", () => showStep(Math.max(0, current - 1)));
nextBtn.addEventListener("click", () => {
  if (!validateStep(current)) return;
  if (current < steps.length - 1) showStep(current + 1);
  else submit();
});

/* ---------- «Не знаю время» ---------- */
timeUnknownEl.addEventListener("change", () => {
  hourEl.disabled = timeUnknownEl.checked;
  minuteEl.disabled = timeUnknownEl.checked;
  if (timeUnknownEl.checked) { hourEl.value = "12"; minuteEl.value = "00"; }
  setHint("hint-time", "");
});

/* ---------- Автокомплит городов (GeoNames, опционально) ---------- */
const GEONAMES_USER = new URLSearchParams(location.search).get("gn") || "";
let suggTimer = null;
let suggAbort = null;

cityEl.addEventListener("input", () => {
  suggEl.classList.remove("open");
  clearTimeout(suggTimer);
  const q = cityEl.value.trim();
  if (!GEONAMES_USER || q.length < 2) return;
  suggTimer = setTimeout(() => fetchCities(q), 300);
});

async function fetchCities(q) {
  if (suggAbort) suggAbort.abort();
  suggAbort = new AbortController();
  try {
    const url = "https://secure.geonames.org/searchJSON?featureClass=P&orderby=population"
      + "&maxRows=5&lang=ru&username=" + encodeURIComponent(GEONAMES_USER)
      + "&name_startsWith=" + encodeURIComponent(q);
    const res = await fetch(url, { signal: suggAbort.signal });
    const data = await res.json();
    renderSuggestions(data.geonames || []);
  } catch (e) {
    if (e.name !== "AbortError") renderSuggestions([]);
  }
}

function renderSuggestions(items) {
  suggEl.innerHTML = "";
  if (!items.length) { suggEl.classList.remove("open"); return; }
  for (const item of items) {
    const div = document.createElement("div");
    div.className = "suggestion";
    const region = [item.adminName1, item.countryName].filter(Boolean).join(", ");
    div.innerHTML = "";
    div.appendChild(document.createTextNode(item.name));
    const small = document.createElement("small");
    small.textContent = region;
    div.appendChild(small);
    div.addEventListener("click", () => {
      cityEl.value = region ? item.name + ", " + item.countryName : item.name;
      suggEl.classList.remove("open");
      setHint("hint-city", "");
    });
    suggEl.appendChild(div);
  }
  suggEl.classList.add("open");
}

document.addEventListener("click", (e) => {
  if (!suggEl.contains(e.target) && e.target !== cityEl) suggEl.classList.remove("open");
});

/* ---------- Отправка ---------- */
function collectPayload() {
  const timeUncertain = timeUnknownEl.checked;
  return {
    v: 1,
    kind: "astro_profile",
    full_name: nameEl.value.trim(),
    birth_date: `${yearEl.value}-${monthEl.value}-${String(dayEl.value).padStart(2, "0")}`, // YYYY-MM-DD
    birth_time: timeUncertain ? null : `${hourEl.value}:${minuteEl.value}`,
    time_uncertain: timeUncertain,
    birth_city: cityEl.value.trim(),
  };
}

function showDone(debugPayload) {
  document.getElementById("wizard").hidden = true;
  document.getElementById("dots").hidden = true;
  document.querySelector(".subtitle").hidden = true;
  const done = document.getElementById("done");
  done.hidden = false;
  if (debugPayload) {
    document.getElementById("done-text").textContent = "Режим браузера — данные не отправлены:";
    const dbg = document.getElementById("debug");
    dbg.hidden = false;
    dbg.textContent = JSON.stringify(debugPayload, null, 2);
  }
}

function showError(msg) {
  setHint("hint-city", msg, true);
}

function submit() {
  const payload = collectPayload();
  const json = JSON.stringify(payload);

  if (isTelegram) {
    if (tg && tg.sendData) {
      tg.sendData(json); // Telegram сам закроет мини-приложение
    } else {
      showError("Не удалось связаться с Telegram. Закройте анкету и откройте заново через /anketa.");
    }
    return;
  }
  if (maxApp) {
    if (!MAX_ENDPOINT) { showError("Канал отправки для MAX ещё настраивается."); return; }
    nextBtn.disabled = true;
    fetch(MAX_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData: maxApp.initData, profile: payload }),
    })
      .then((r) => { if (!r.ok) throw new Error(); showDone(); })
      .catch(() => { showError("Не удалось отправить. Попробуйте ещё раз."); nextBtn.disabled = false; });
    return;
  }
  showDone(payload); // обычный браузер — отладка
  document.getElementById("debug").textContent +=
    "\n\n— диагностика —\nhash: " + (location.hash ? location.hash.slice(0, 40) : "(пусто)") +
    "\nua: " + navigator.userAgent;
}

showStep(0);
</script>
</body>
</html>
